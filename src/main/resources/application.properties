# Étape 2 : configuration de la connexion à la base et de Hibernate.
# Ces valeurs sont lues par HibernateConfig grâce à @PropertySource + Environment.

# --- Connexion JDBC (MySQL) ---
# createDatabaseIfNotExist=true : la base product_db est créée automatiquement si elle n'existe pas.
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/product_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
jdbc.username=root
# Mettre ici votre mot de passe MySQL (vide par défaut avec Laragon / XAMPP).
jdbc.password=

# --- Hibernate ---
# Dialecte : indique à Hibernate quel SQL générer (ici MySQL 8).
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Affiche dans la console les requêtes SQL générées.
hibernate.show_sql=true
# update : Hibernate crée / met à jour la table "products" à partir de l'entité, sans supprimer les données.
hibernate.hbm2ddl.auto=update
